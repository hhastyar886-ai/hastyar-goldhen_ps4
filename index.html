<!DOCTYPE html>

            background-size: cover;
            background-position: center;

            color: white;

            padding: 30px 15px;
        }
        h1 {
            color: #00ffcc;
            font-size: 2.2rem;
            text-shadow: 0px 0px 25px #ff0055, 0px 0px 5px #000;
            margin-bottom: 5px;

        }
        .badge {

            padding: 6px 20px;

            font-weight: bold;
            font-size: 1.1rem;
            display: inline-block;

        .status-box {

        .btn {

            border: 2px solid #00ffcc;
            color: white;
            padding: 14px 20px;
            font-size: 1.15rem;
            font-weight: bold;
            border-radius: 12px;

            box-shadow: 0 5px 15px rgba(0,0,0,0.5);

            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover {
            background: linear-gradient(135deg, #ff0055, #7a0029);
            border-color: #ffffff;
            transform: scale(1.03);
            box-shadow: 0 0 20px #ff0055;
        }
        .footer {
            margin-top: 50px;
            font-size: 0.95rem;
            color: #aaa;
            text-shadow: 1px 1px 3px #000;
